name: Build Backend

on:
  workflow_call:
  push:
    tags:
      - "backend_v*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  tests:
    uses: ./.github/workflows/go-tests.yml

  code-style:
    uses: ./.github/workflows/go-code-style.yml

  build:
    needs: [tests, code-style]

    runs-on: ubuntu-latest

    steps:
      - name: Lowercase Repository Name
        id: repository
        uses: Entepotenz/change-string-case-action-min-dependencies@v1
        with:
          string: ${{ github.repository }}

      - name: Check out code
        uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.repository.outputs.lowercase }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repository.outputs.lowercase }}/scrum-poker-backend:${{ github.ref_name }}
            ghcr.io/${{ steps.repository.outputs.lowercase }}/scrum-poker-backend:${{ github.sha }}
            ghcr.io/${{ steps.repository.outputs.lowercase }}/scrum-poker-backend:latest

      - name: Build and push Docker image (push)
        if: startsWith(github.ref, 'refs/heads/main')
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repository.outputs.lowercase }}/scrum-poker-backend:${{ github.sha }}
            ghcr.io/${{ steps.repository.outputs.lowercase }}/scrum-poker-backend:latest
